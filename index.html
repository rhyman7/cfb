<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CFB Matchup Dashboard</title>
<link rel="stylesheet" href="style.css?v=202609300520">
</head>
<body data-page="week">
<header class="topbar">
  <h1><a href="index.html" class="home-link">CFB Matchup Dashboard</a></h1>
  <nav class="topnav no-print">
    <a href="index.html" class="active">This Week's Games</a>
    <a href="dashboard.html">Compare Any Two Teams</a>
    <a href="ratings.html">Ratings Explained</a>
  </nav>
</header>

<main id="app">
  <section class="week-head">
    <div>
      <h2 id="weekTitle" class="week-title">This Week's Matchups</h2>
      <p id="weekSub" class="week-sub"></p>
      <p id="liveNote" class="live-note" hidden></p>
    </div>
    <div class="week-filters">
      <input id="teamSearch" type="search" placeholder="Find a team" aria-label="Find a team">
      <select id="confFilter" aria-label="Conference"></select>
      <label class="ranked-toggle"><input id="rankedOnly" type="checkbox"> Top 25 only</label>
      <button id="printAllBtn" class="print-btn" type="button" title="Print every game shown, one matchup per page">🖨 Print all</button>
    </div>
  </section>
  <div id="gameList"><div class="empty-note">Loading games...</div></div>
</main>

<footer class="no-print">
  <p>All FBS teams · 2026 regular season · updated weekly. <span id="sourceNote"></span> Lines: ESPN when available, otherwise the weekly consensus. <a href="https://open-meteo.com/" rel="noopener">Weather data by Open-Meteo.com</a>.</p>
</footer>

<script src="app.js?v=202609300520"></script>
<script src="live.js?v=202609300520"></script>
<script src="weather.js?v=202609300520"></script>
</body>
</html>

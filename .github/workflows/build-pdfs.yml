name: Build PDFs

# Rebuilds pdf/: the EPA page's Download PDF (epa.pdf) and the game packets (Weekly Matchup Report,
# printed matchups, EPA and value board pages, plus packets.json) whenever the data or a layout
# changes, and daily after the value board's own update.
on:
  push:
    branches: [main]
    paths:
      - "data/data.json"
      - "data/epa.json"
      - "data/injuries.json"
      - "epa.html"
      - "epa.js"
      - "app.js"
      - "teamcolors.js"
      - "style.css"
      - "print.html"
      - "scripts/build_pdfs.py"
      - "scripts/build_report.py"
      - "scripts/build_packets.py"
      - "scripts/report.css"
  schedule:
    - cron: "13 14 * 8-12,1 *"      # daily 14:13 UTC, after the college value board updates (12:43)
    - cron: "13 18,22 * 8-12,1 6"   # Saturdays also after its 16:43 and 20:43 updates
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: build-pdfs
  cancel-in-progress: true

jobs:
  pdfs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      # the value board (public repo) supplies part 4 of each packet
      - uses: actions/checkout@v4
        with:
          repository: rhyman7/fb-value-board
          path: _value-board

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Playwright + Chromium
        run: |
          pip install playwright pypdf
          # Ubuntu's package mirrors sometimes fail to resolve on the runner; retry before giving up
          for i in 1 2 3 4; do
            python -m playwright install --with-deps chromium && exit 0
            echo "Playwright install failed (attempt $i); retrying in $((i * 30))s"
            sleep $((i * 30))
          done
          exit 1

      - name: Build EPA PDF
        run: python scripts/build_pdfs.py

      - name: Build game packets
        run: python scripts/build_packets.py --value-board _value-board

      - name: Commit PDFs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A pdf
          git add data/best_overall.json   # the Best Overall record, written by build_report.py
          if git diff --staged --quiet; then exit 0; fi
          git commit -m "Rebuild PDFs and game packets"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            sleep 5
          done
          exit 1

name: Build EPA PDF

# Rebuilds pdf/epa.pdf (the EPA page's Download PDF) whenever the data or the page changes.
on:
  push:
    branches: [main]
    paths:
      - "data/data.json"
      - "data/epa.json"
      - "epa.html"
      - "epa.js"
      - "app.js"
      - "teamcolors.js"
      - "style.css"
      - "scripts/build_pdfs.py"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: build-pdfs
  cancel-in-progress: true

jobs:
  pdfs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Playwright + Chromium
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Build PDF
        run: python scripts/build_pdfs.py

      - name: Commit PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A pdf
          if git diff --staged --quiet; then exit 0; fi
          git commit -m "Rebuild EPA PDF"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            sleep 5
          done
          exit 1

<!DOCTYPE html>
<html lang="en">

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Matchup · CFB Matchup Dashboard</title>
<link rel="stylesheet" href="style.css">
</head>
<body data-page="matchup">
<header class="topbar">
  <h1><a href="index.html" class="home-link">CFB Matchup Dashboard</a></h1>

  </nav>
